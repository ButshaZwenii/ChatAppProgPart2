name: Java CI with Maven

# Testdata.yml is read by MessageTest.java. Running the JUnit suite therefore
# uses the assignment test data in both local Maven runs and GitHub Actions.
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Check required assignment test data
        run: test -f Testdata.yml

      - name: Run all JUnit tests using the assignment test data
        run: mvn -B clean verify --file pom.xml
